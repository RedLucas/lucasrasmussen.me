name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cheapest, fastest checks first, so a bad PR fails in seconds rather
      # than waiting for the full build.
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm run build
